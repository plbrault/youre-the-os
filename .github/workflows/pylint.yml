
name: pylint
on: [pull_request]


jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        pip install pipenv==2026.10.5
        pipenv sync --dev
    - name: Run pylint
      run: pipenv run pylint
