
name: pytest
on: [pull_request]


jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v3
      with:
        path: ./.venv
        key: ${{ runner.os }}-venv-${{ hashFiles('./Pipfile.lock') }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        pip install pipenv
        pipenv sync --dev
    - name: Run pytest
      run: pipenv run pytest
